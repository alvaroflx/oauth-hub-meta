# ============================================================
# BUILDER
# ============================================================

FROM node:20-bookworm-slim AS builder

WORKDIR /app

# Toolchain para módulos nativos como node-pty
RUN apt-get update \
    && apt-get install -y --no-install-recommends \
        python3 \
        make \
        g++ \
    && rm -rf /var/lib/apt/lists/*

COPY package.json package-lock.json ./

# Instala todas as dependências
RUN npm ci

COPY tsconfig.json ./
COPY src ./src

# Compila TypeScript
RUN npm run build

# Remove dependências exclusivamente de desenvolvimento
# Mantém ws, node-pty etc. se estiverem em dependencies
RUN npm prune --omit=dev


# ============================================================
# RUNTIME
# ============================================================

FROM node:20-bookworm-slim AS runtime

WORKDIR /app

ENV NODE_ENV=production
ENV PORT=3300

# Dependências já compiladas no builder
COPY --from=builder /app/node_modules ./node_modules

COPY --from=builder /app/dist ./dist

COPY package.json package-lock.json ./
COPY public ./public
COPY locales ./locales

RUN mkdir -p /app/data \
    && chown -R node:node /app/data

EXPOSE 3300

USER node

HEALTHCHECK --interval=30s --timeout=5s --start-period=15s --retries=3 \
    CMD node -e "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

CMD ["node", "dist/index.js"]
